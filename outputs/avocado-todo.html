<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f5ec">
<title>青提 · 每周待办</title>
<style>
:root{--bg:#f4f5ec;--paper:#fffef9;--ink:#26372c;--muted:#879187;--line:#e9ede3;--green:#456b50;--sage:#dce9d8;--lime:#edf1cf;--cream:#f4e8c8;--rose:#f2dfd4;--shadow:0 12px 36px #253b2810;--radius:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit} .shell{max-width:1320px;margin:auto;padding:20px 28px 38px}.topbar{height:48px;display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px}.logo{height:34px;width:34px;border-radius:12px;background:#dce9d8;display:grid;place-items:center;font-size:19px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:-2px}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn{border:1px solid var(--line);background:#fffefa;width:38px;height:38px;border-radius:13px;font-size:16px}.avatar{width:34px;height:34px;border-radius:50%;background:#ecd9bd;display:grid;place-items:center;font-weight:700;font-size:12px}.hero{display:flex;align-items:end;justify-content:space-between;margin:0 0 20px}.eyebrow{color:var(--green);font-size:12px;font-weight:650;letter-spacing:.04em}.hero h1{font-size:28px;letter-spacing:-.04em;line-height:1.15;margin:7px 0 4px}.hero p{color:var(--muted);margin:0;font-size:13px}.today{color:var(--muted);font-size:12px;background:#fffefa;padding:9px 13px;border-radius:14px;border:1px solid var(--line)}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.9fr);gap:16px;align-items:start}.column{display:grid;gap:16px;align-content:start}.card{background:var(--paper);border:1px solid #eaede4;border-radius:var(--radius);box-shadow:var(--shadow);padding:19px}.card[draggable="true"]{cursor:grab}.card.dragging{opacity:.55;transform:scale(.99)}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.heading{display:flex;gap:9px;align-items:center;font-weight:700;font-size:15px}.heading .emoji{font-size:18px}.sub{color:var(--muted);font-size:11px}.dots{color:#a3aaa0;letter-spacing:2px;font-weight:700}.capture{background:#f9faF4;border:1px solid var(--line);border-radius:15px;padding:12px}.capture textarea{width:100%;height:78px;resize:vertical;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px;line-height:1.6}.capture textarea::placeholder{color:#a7afa4}.capture-foot{display:flex;justify-content:space-between;align-items:center}.hint{font-size:11px;color:var(--muted)}.primary{background:var(--green);color:white;border:0;border-radius:12px;padding:9px 14px;font-size:12px;font-weight:650;box-shadow:0 4px 10px #456b5022}.primary:hover{background:#365c40}.tasklist{display:grid;gap:4px}.task{display:flex;align-items:center;gap:11px;padding:10px 5px;border-bottom:1px solid #f0f1eb;min-height:54px}.task:last-child{border-bottom:0}.check{width:19px;height:19px;border:1.5px solid #c6cec2;background:white;border-radius:7px;flex:none;display:grid;place-items:center;padding:0}.check.done{background:#789777;border-color:#789777;color:#fff;font-size:12px}.task-main{flex:1;min-width:0}.task-title{font-size:13px;font-weight:550;overflow-wrap:anywhere}.task.done .task-title{text-decoration:line-through;color:#9ba49a}.task-meta{display:flex;gap:8px;align-items:center;margin-top:3px;color:var(--muted);font-size:10px}.tag{padding:2px 7px;border-radius:7px;background:var(--lime);color:#657240}.tag.todaytag{background:var(--sage);color:#4f7454}.tag.later{background:var(--cream);color:#8b7043}.delete{border:0;background:none;color:#b5bcb1;font-size:17px;padding:4px}.delete:hover{color:#a46856}.week-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.week-nav{display:flex;gap:6px}.week-nav button{border:1px solid var(--line);background:#fff;border-radius:9px;width:27px;height:27px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{padding:9px 4px 8px;text-align:center;border-radius:13px;background:#f7f8f2;min-height:83px}.day.today{background:#e0ebd9}.day .dow{font-size:10px;color:var(--muted)}.day .date{font-size:15px;font-weight:700;margin:2px 0 8px}.pips{display:flex;justify-content:center;gap:3px;min-height:7px}.pip{width:6px;height:6px;border-radius:50%;background:#c5d9c1}.pip.done{background:#789777}.pip.todo{background:#e6c985}.pip.rest{background:#d8ddd3}.legend{display:flex;gap:13px;margin-top:12px;color:var(--muted);font-size:10px}.legend span{display:flex;align-items:center;gap:5px}.swatch{width:8px;height:8px;border-radius:50%}.progress{background:linear-gradient(110deg,#eff2d9,#f4ecd5);border:1px solid #ebecd9;border-radius:16px;padding:15px;margin-top:14px;display:flex;align-items:center;justify-content:space-between}.progress strong{font-size:13px}.progress p{font-size:11px;color:#788174;margin:3px 0 0}.ring{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#6e916b 0 68%,#dce4d2 68% 100%);position:relative;font-size:11px;font-weight:700}.ring:before{content:"";position:absolute;inset:5px;border-radius:50%;background:#f1f1dc}.ring span{z-index:1}.module-note{color:var(--muted);font-size:11px}.calendar-link{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:12px}.cal-icon{width:36px;height:36px;display:grid;place-items:center;background:#edf1e8;border-radius:11px;font-size:18px}.cal-copy{flex:1}.cal-copy strong{display:block;font-size:12px}.cal-copy small{font-size:10px;color:var(--muted)}.arrow{font-size:17px;color:#9ca79a}.bottom-note{text-align:center;color:#a0a89e;font-size:10px;margin-top:18px}.mobile-add{display:none}
@media(max-width:760px){.shell{padding:12px 14px calc(74px + env(safe-area-inset-bottom))}.topbar{height:40px;margin-bottom:17px}.brand{font-size:14px}.logo{width:31px;height:31px}.top-actions{gap:7px}.top-actions .icon-btn{width:34px;height:34px}.hero{align-items:center;margin-bottom:15px}.hero h1{font-size:22px}.hero p{font-size:11px}.today{font-size:10px;padding:7px 9px}.layout{grid-template-columns:1fr;gap:12px}.column{gap:12px}.card{padding:15px;border-radius:17px}.capture textarea{height:64px}.card-head{margin-bottom:11px}.week{gap:4px}.day{min-height:73px;padding:7px 2px}.day .dow{font-size:9px}.day .date{font-size:13px;margin:2px 0 6px}.legend{font-size:9px;gap:9px}.progress{padding:12px;margin-top:11px}.ring{width:44px;height:44px}.task{min-height:49px;padding:8px 2px}.task-title{font-size:12px}.task-meta{font-size:9px}.bottom-note{display:none}.mobile-add{display:flex;position:fixed;z-index:5;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);align-items:center;gap:7px;border:0;border-radius:22px;padding:12px 18px;background:var(--green);color:white;box-shadow:0 8px 25px #26372c33;font-weight:650;font-size:12px}.column.secondary{grid-template-columns:1fr 1fr;align-items:start}.secondary .card{height:100%}.calendar-link{padding:9px;gap:7px}.cal-icon{width:30px;height:30px}.cal-copy strong{font-size:10px}.cal-copy small{font-size:9px}.module-note{font-size:10px}}
@media(max-width:390px){.column.secondary{grid-template-columns:1fr}.secondary .card{height:auto}.week{gap:3px}.day{min-height:68px}.legend{gap:7px}.today{max-width:105px;text-align:center}}
</style></head>
<body><main class="shell"><header class="topbar"><div class="brand"><div class="logo">🥑</div><div>青提<small>轻一点，慢慢来</small></div></div><div class="top-actions"><button class="icon-btn" id="notify" title="开启提醒">♧</button><button class="icon-btn" id="export" title="导出到日历">▣</button><div class="avatar">YD</div></div></header>
<section class="hero"><div><div class="eyebrow">WEDNESDAY · WEEK 43</div><h1>把今天过得刚刚好</h1><p>先做一件小事，剩下的慢慢来。</p></div><div class="today">10月21日 · 星期三</div></section>
<section class="layout" id="layout"><div class="column" data-column="main">
<article class="card" draggable="true" data-module="capture"><div class="card-head"><div><div class="heading"><span class="emoji">✍️</span>灵感变待办</div><div class="sub">粘贴一段话，青提帮你理出下一步</div></div><span class="dots">⠿</span></div><div class="capture"><textarea id="captureText" placeholder="例如：周五前把报告初稿发给导师，明天下午约小林讨论数据，记得买咖啡豆……"></textarea><div class="capture-foot"><span class="hint">支持自然语言 · 自动识别日期和事项</span><button class="primary" id="captureBtn">✨ 整理成待办</button></div></div></article>
<article class="card" draggable="true" data-module="tasks"><div class="card-head"><div><div class="heading"><span class="emoji">🌱</span>接下来</div><div class="sub" id="taskSummary">今天轻轻推进几件事</div></div><button class="dots" id="addTask" title="新增待办">＋</button></div><div class="tasklist" id="taskList"></div></article>
</div><div class="column secondary" data-column="side">
<article class="card" draggable="true" data-module="week"><div class="card-head"><div><div class="heading"><span class="emoji">🗓️</span>这一周</div><div class="sub">每天一点点，也很了不起</div></div><span class="dots">⠿</span></div><div class="week" id="week"></div><div class="legend"><span><i class="swatch" style="background:#789777"></i>已完成</span><span><i class="swatch" style="background:#e6c985"></i>待完成</span><span><i class="swatch" style="background:#d8ddd3"></i>休息日</span></div><div class="progress"><div><strong>本周进度</strong><p id="weekStats">持续前进中 ✨</p></div><div class="ring"><span id="progressText">68%</span></div></div></article>
<article class="card" draggable="true" data-module="sync"><div class="card-head"><div><div class="heading"><span class="emoji">🔔</span>日历与提醒</div><div class="sub">重要的事，轻轻提醒你</div></div><span class="dots">⠿</span></div><p class="module-note">把安排放进熟悉的日历，节奏由你掌握。</p><button class="calendar-link" id="calendarBtn" style="width:100%;text-align:left"><span class="cal-icon">📅</span><span class="cal-copy"><strong>导出 Apple 日历</strong><small>添加到 Mac、iPhone 日历</small></span><span class="arrow">›</span></button><button class="calendar-link" id="reminderBtn" style="width:100%;text-align:left"><span class="cal-icon">🌤️</span><span class="cal-copy"><strong id="reminderTitle">开启轻提醒</strong><small id="reminderSub">到点提醒，不错过重要安排</small></span><span class="arrow">›</span></button></article>
</div></section><div class="bottom-note">拖住模块右上角的 ⠿，可以按自己的习惯重新排布</div></main><button class="mobile-add" id="mobileAdd">＋ 添加一件小事</button>
<script>
const initial=[{title:'把项目提案初稿发给导师',date:'今天',time:'16:00',done:false,tag:'重要'},{title:'和小林确认周末的安排',date:'今天',time:'18:30',done:false,tag:'今天'},{title:'买一袋喜欢的咖啡豆',date:'明天',time:'',done:true,tag:'生活'},{title:'整理桌面和下载文件夹',date:'周五',time:'',done:false,tag:'稍后'}];let tasks=JSON.parse(localStorage.getItem('qingti-tasks')||'null')||initial;const list=document.querySelector('#taskList');function persist(){localStorage.setItem('qingti-tasks',JSON.stringify(tasks));render()}
function render(){list.innerHTML='';tasks.forEach((t,i)=>{const row=document.createElement('div');row.className='task'+(t.done?' done':'');row.innerHTML=`<button class="check ${t.done?'done':''}" aria-label="标记完成">${t.done?'✓':''}</button><div class="task-main"><div class="task-title"></div><div class="task-meta"><span>${t.date||'未安排'}${t.time?' · '+t.time:''}</span><span class="tag ${t.date==='今天'?'todaytag':t.date==='明天'?'later':''}">${t.tag||'待办'}</span></div></div><button class="delete" aria-label="删除">×</button>`;row.querySelector('.task-title').textContent=t.title;row.querySelector('.check').onclick=()=>{tasks[i].done=!tasks[i].done;persist()};row.querySelector('.delete').onclick=()=>{tasks.splice(i,1);persist()};list.append(row)});document.querySelector('#taskSummary').textContent=`${tasks.filter(t=>!t.done).length} 件待办 · 按自己的节奏来`;drawWeek()}
function drawWeek(){const week=document.querySelector('#week');week.innerHTML='';const names=['一','二','三','四','五','六','日'];[19,20,21,22,23,24,25].forEach((d,i)=>{const el=document.createElement('div');el.className='day'+(d===21?' today':'');const done=i<2?1:i===2?tasks.filter(x=>x.done).length:i===3?1:0;const todo=i===2?tasks.filter(x=>!x.done).length:i===3?2:i===4?1:0;let dots='';for(let n=0;n<Math.min(done,3);n++)dots+='<i class="pip done"></i>';for(let n=0;n<Math.min(todo,3);n++)dots+='<i class="pip todo"></i>';if(!done&&!todo)dots='<i class="pip rest"></i>';el.innerHTML=`<div class="dow">周${names[i]}</div><div class="date">${d}</div><div class="pips">${dots}</div>`;week.append(el)});let done=tasks.filter(t=>t.done).length,total=tasks.length;let p=total?Math.round(done/total*100):0;document.querySelector('#progressText').textContent=p+'%';document.querySelector('.ring').style.background=`conic-gradient(#6e916b 0 ${p}%,#dce4d2 ${p}% 100%)`;document.querySelector('#weekStats').textContent=`完成 ${done} 件，继续慢慢前进 ✨`}
function parseLong(s){const chunks=s.split(/[。；;\n]+/).map(x=>x.trim()).filter(x=>x.length>2);return chunks.map(text=>{let date='待安排';if(/今天|今晚/.test(text))date='今天';else if(/明天|明早|明晚/.test(text))date='明天';else if(/周五|星期五/.test(text))date='周五';else if(/周[一二三四五六日天]|下周/.test(text))date='本周';let time=(text.match(/(?:上午|下午|晚上)?\s*(?:\d{1,2})(?::\d{2})?\s*(?:点)?/ )||[])[0]||'';return{title:text.replace(/(?:今天|今晚|明天|明早|明晚|周[一二三四五六日天]|下周)/g,'').trim()||text,date,time,done:false,tag:date==='今天'?'今天':date==='待安排'?'新事项':'稍后'}})}
function capture(){let v=document.querySelector('#captureText').value.trim();if(!v){document.querySelector('#captureText').focus();return}let created=parseLong(v);tasks=[...created,...tasks];persist();document.querySelector('#captureText').value='';document.querySelector('#taskList').scrollIntoView({behavior:'smooth',block:'nearest'})}document.querySelector('#captureBtn').onclick=capture;document.querySelector('#addTask').onclick=()=>{let title=prompt('想记下什么小事？');if(title?.trim()){tasks.unshift({title:title.trim(),date:'待安排',done:false,tag:'新事项'});persist()}};document.querySelector('#mobileAdd').onclick=()=>{document.querySelector('#captureText').scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>document.querySelector('#captureText').focus(),350)};
function exportICS(){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Qingti//Todo//ZH'];tasks.filter(t=>!t.done).forEach((t,i)=>{let date=t.date==='今天'?'20261021':t.date==='明天'?'20261022':t.date==='周五'?'20261023':'20261021';let time=t.time?t.time.replace(/[^0-9:]/g,''):'09:00';if(!time.includes(':'))time+=':00';let [h,m]=time.split(':');let stamp=date+'T'+(h||'09').padStart(2,'0')+(m||'00').padStart(2,'0')+'00';lines.push('BEGIN:VEVENT','UID:qingti-'+Date.now()+'-'+i+'@local','DTSTAMP:20261021T000000Z','DTSTART:'+stamp,'SUMMARY:'+t.title.replace(/[,;\\]/g,'\\$&'),'END:VEVENT')});lines.push('END:VCALENDAR');const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='青提待办.ics';a.click();URL.revokeObjectURL(a.href)}document.querySelector('#export').onclick=exportICS;document.querySelector('#calendarBtn').onclick=exportICS;
document.querySelector('#notify').onclick=enableNotify;document.querySelector('#reminderBtn').onclick=enableNotify;async function enableNotify(){if(!('Notification'in window)){alert('当前浏览器不支持网页提醒。你仍可以导出日历事件，在 Apple 日历中设置提醒。');return}let result=await Notification.requestPermission();if(result==='granted'){document.querySelector('#reminderTitle').textContent='轻提醒已开启';document.querySelector('#reminderSub').textContent='此浏览器已允许发送提醒';new Notification('青提提醒已开启',{body:'今天的安排会在这个设备上轻轻提醒你。'})}else alert('尚未开启提醒权限，可以在浏览器设置中允许青提发送通知。')}
let drag=null;document.querySelectorAll('.card[draggable]').forEach(card=>{card.addEventListener('dragstart',e=>{drag=card;card.classList.add('dragging');e.dataTransfer.effectAllowed='move'});card.addEventListener('dragend',()=>{card.classList.remove('dragging');drag=null});card.addEventListener('dragover',e=>e.preventDefault());card.addEventListener('drop',e=>{e.preventDefault();if(drag&&drag!==card){const parent=card.parentElement;parent.insertBefore(drag,card);saveOrder()}})});function saveOrder(){const order={main:[...document.querySelector('[data-column="main"]').children].map(x=>x.dataset.module),side:[...document.querySelector('[data-column="side"]').children].map(x=>x.dataset.module)};localStorage.setItem('qingti-order',JSON.stringify(order))}function loadOrder(){let order=JSON.parse(localStorage.getItem('qingti-order')||'null');if(!order||Array.isArray(order))return;const cards=[...document.querySelectorAll('.card')];for(const [colName,ids] of Object.entries(order)){const col=document.querySelector(`[data-column="${colName}"]`);if(!col)continue;ids.forEach(id=>{const c=cards.find(x=>x.dataset.module===id);if(c)col.append(c)})}}render();loadOrder();
</script></body></html>
